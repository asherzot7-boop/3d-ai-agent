<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Immunolab — дашборд</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#eef2f9;--card:#fff;--fg:#14233d;--mut:#6b7a90;--line:#e3e9f3;--acc:#2f7be5;--ok:#2fa35b;--bad:#d6455d;--warn:#e5902f;--nav:#0b1f44;--sh:0 1px 3px rgba(20,40,80,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--card:#172131;--fg:#e6ebf1;--mut:#93a1b4;--line:#263446;--nav:#08142e;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1522;--card:#172131;--fg:#e6ebf1;--mut:#93a1b4;--line:#263446;--nav:#08142e;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;line-height:1.4}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,var(--nav),#0a1a3a);color:#cfd9ec;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;color:#fff;font-weight:700}
.logo i{font-style:normal;background:#2f7be5;border-radius:10px;padding:6px 8px}
.logo small{display:block;font-weight:400;font-size:11px;opacity:.7}
nav button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:10px;border-radius:10px;cursor:pointer;margin-bottom:2px}
nav button.on{background:var(--acc);color:#fff}
nav button:hover:not(.on){background:rgba(255,255,255,.08)}
.demo{margin:14px 6px 0;padding:10px;border-radius:10px;background:rgba(229,144,47,.18);color:#ffd9a8;font-size:12px}
main{padding:16px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{margin:0;font-size:22px}.top p{margin:2px 0 0;color:var(--mut)}
.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--sh);white-space:nowrap}
.grid{display:grid;gap:12px;margin-bottom:12px}
.g7{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh);min-width:0}
.card h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 a{font-size:12px;font-weight:500;color:var(--acc);text-decoration:none}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .l{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.kpi .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px}
.kpi .d{font-size:12px;color:var(--mut)}
.up{color:var(--ok);font-weight:600}.dn{color:var(--bad);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:500;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.c-ok{background:rgba(47,163,91,.15);color:var(--ok)}.c-bad{background:rgba(214,69,93,.15);color:var(--bad)}.c-warn{background:rgba(229,144,47,.16);color:var(--warn)}.c-info{background:rgba(47,123,229,.15);color:var(--acc)}.c-mut{background:rgba(120,135,155,.18);color:var(--mut)}
.pg{height:7px;background:var(--line);border-radius:6px;overflow:hidden;min-width:60px}.pg i{display:block;height:7px;border-radius:6px}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;margin-right:8px;vertical-align:middle}
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.flow div{flex:1;min-width:70px;border-radius:12px;padding:10px 6px;text-align:center;font-size:12px}
.flow b{display:block;font-size:22px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.mini div{background:var(--bg);border-radius:10px;padding:8px;font-size:12px;color:var(--mut)}.mini b{display:block;font-size:17px;color:var(--fg)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.alert:last-child{border:0}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.leg{display:grid;gap:5px;font-size:13px;flex:1;min-width:150px}.leg div{display:flex;gap:8px;align-items:center}.leg i{width:10px;height:10px;border-radius:3px;flex:none}.leg b{margin-left:auto}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cab{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.cab div{border-radius:12px;padding:10px;font-size:12px}.cab b{font-size:18px;display:block}
.btn{display:inline-block;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer;text-decoration:none;margin:0 6px 6px 0}
.btn:disabled,.btn.off{opacity:.5;cursor:default}
.qchip{display:inline-block;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;cursor:pointer;margin:0 6px 6px 0}.qchip.on{background:var(--acc);color:#fff;border-color:var(--acc)}.qbtn{border:0;border-radius:8px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer;color:#fff;margin-right:4px}
.hint{color:var(--mut);font-size:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;font:inherit;color:var(--fg);box-shadow:var(--sh)}.tile span{display:block;font-size:24px;margin-bottom:4px}.tile.off{opacity:.5;cursor:default}
@media (max-width:820px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:8px}.logo,.demo{display:none}#items{display:flex;gap:4px}nav button{width:auto;white-space:nowrap;margin:0}.g2{grid-template-columns:1fr}}
</style></head><body>
<div class="app">
<nav id="nav"><div class="logo"><i>🧬</i><div>Immunolab<small>Управление центром</small></div></div><div id="items"></div><div class="demo"><b>Демо-данные.</b><br>Структура и сотрудники настоящие, цифры показателей примерные.</div></nav>
<main id="main"></main>
</div>
<script>
const $=id=>document.getElementById(id);
const URL3D='#go-model3d',URLSCHOOL='#go-school',URLFORM='#go-problems';
function tz(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tashkent',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short',hour12:false}).formatToParts(new Date());const g=t=>(p.find(x=>x.type==t)||{}).value;return{day:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(g('weekday')),min:(+g('hour')%24)*60+(+g('minute')),date:g('day')+'.'+g('month')+'.'+g('year'),time:g('hour')+':'+g('minute')}}
const NOW=tz();
const ALL=[0,1,2,3,4,5];
const STAFF=[
['Абдуллаев Акмал','Директор','Руководство','—',ALL],['Саидов Дилмурод','Управляющий лаборатории','Руководство','Весь этаж',ALL],
['Мансуров Авазбек','Врач-лаборант','Лаборатория','19',ALL],['Алишеров Юсуфбек','Лаборант ПЦР','Лаборатория','18, 20–23',ALL],
['Абдукаххорова Райхона','Медсестра-лаборант','Лаборатория','18, 20–23',ALL],['Маликжонова Одина','Медсестра по забору крови','Лаборатория','18',ALL],
['Тошбоев Улугбек','Выездной лаборант','Лаборатория','Выезд',[]],
['Каримова Гулчирой','Регистратор и кассир','Регистратура','16',ALL],
['Юсупов Абдулазиз','Невролог','Клиника','4',ALL],['Атабаева Жамила','Педиатр','Клиника','5',ALL],['Муножат','Процедурная','Клиника','11',ALL],
['Тожимирзаева Комила','Медсестра по вакцине','Вакцинация','6, 7',ALL],['Бакиев Дилмурод','Кассир по вакцине','Вакцинация','12',ALL],['Бакиев Жохонгир','Комната 12','Вакцинация','12',ALL],['Исматов Рустам','Вакцина и филиалы','Вакцинация','Весь этаж',ALL],
['Шомирзаева Манзура','Уборщица и повар','Хозяйство','Кухня 3',ALL],['Собирова Нафиса','Уборщица и повар','Хозяйство','Залы',ALL],['Ахмедов Шерзод','Водитель','Выезд','Выезд',ALL]];
function status(s){const d=s[4];if(!d.length)return['По вызову','c-mut'];if(!d.includes(NOW.day)||NOW.min<480||NOW.min>=1020)return['Вне графика','c-mut'];if(NOW.min>=720&&NOW.min<780)return['Обед','c-warn'];if(s[3]=='Выезд')return['На выезде','c-info'];return['На месте','c-ok']}
const COL=['#2f7be5','#2fa35b','#8a6fd0','#e5902f','#d6455d','#2fa3b3','#5b6b7d'];
const ini=n=>n.split(' ').slice(0,2).map(x=>x[0]).join('');
const av=n=>'<span class="av" style="background:'+COL[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length]+'">'+ini(n)+'</span>';
// графики
function bars(vals,labels,col,fmt){const W=320,H=170,pl=34,pb=22,pt=16,mx=Math.max(...vals)*1.15,n=vals.length,sw=(W-pl-8)/n,bw=sw*.55;let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
 for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*i/4;s+='<line x1="'+pl+'" x2="'+(W-4)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="9" text-anchor="end" fill="var(--mut)">'+Math.round(mx*(1-i/4)*10)/10+'</text>'}
 vals.forEach((v,i)=>{const x=pl+sw*(i+.5)-bw/2,h=(H-pt-pb)*v/mx,y=H-pb-h;s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+col+'" opacity="'+(i==n-1?1:.72)+'"/><text x="'+(x+bw/2)+'" y="'+(H-7)+'" font-size="9" text-anchor="middle" fill="var(--mut)">'+labels[i]+'</text>';if(i==n-1)s+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" font-size="10" font-weight="700" text-anchor="middle" fill="var(--fg)">'+(fmt?fmt(v):v)+'</text>'});return s+'</svg>'}
function combo(b,l,labels){const W=320,H=170,pl=30,pr=26,pb=22,pt=14,n=b.length,sw=(W-pl-pr)/n,bw=sw*.5,mb=Math.max(...b)*1.15,ml=Math.max(...l)*1.15;let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%">';
 for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*i/4;s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(pl-4)+'" y="'+(y+3)+'" font-size="9" text-anchor="end" fill="var(--mut)">'+Math.round(mb*(1-i/4))+'</text><text x="'+(W-pr+4)+'" y="'+(y+3)+'" font-size="9" fill="var(--mut)">'+Math.round(ml*(1-i/4))+'</text>'}
 let pts='';b.forEach((v,i)=>{const x=pl+sw*(i+.5),h=(H-pt-pb)*v/mb;s+='<rect x="'+(x-bw/2)+'" y="'+(H-pb-h)+'" width="'+bw+'" height="'+h+'" rx="3" fill="#2fa35b" opacity=".75"/><text x="'+x+'" y="'+(H-7)+'" font-size="9" text-anchor="middle" fill="var(--mut)">'+labels[i]+'</text>';pts+=(i?' ':'')+x+','+(H-pb-(H-pt-pb)*l[i]/ml)});
 s+='<polyline points="'+pts+'" fill="none" stroke="#2f7be5" stroke-width="2"/>';pts.split(' ').forEach(p=>{const q=p.split(',');s+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="3" fill="#2f7be5"/>'});return s+'</svg>'}
function donut(parts,center,sub){const R=48,C=2*Math.PI*R,tot=parts.reduce((a,p)=>a+p[1],0);let off=0,s='<svg viewBox="0 0 120 120" width="132" height="132"><g transform="rotate(-90 60 60)">';
 parts.forEach(p=>{const l=C*p[1]/tot;s+='<circle cx="60" cy="60" r="'+R+'" fill="none" stroke="'+p[2]+'" stroke-width="16" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-off)+'"/>';off+=l});
 return s+'</g><text x="60" y="60" text-anchor="middle" font-size="17" font-weight="700" fill="var(--fg)">'+center+'</text><text x="60" y="74" text-anchor="middle" font-size="8" fill="var(--mut)">'+(sub||'')+'</text></svg>'}
function legend(parts,suf){const tot=parts.reduce((a,p)=>a+p[1],0);return '<div class="leg">'+parts.map(p=>'<div><i style="background:'+p[2]+'"></i>'+p[0]+'<b>'+Math.round(p[1]/tot*100)+'%'+(suf?' · '+p[1]+suf:'')+'</b></div>').join('')+'</div>'}
const donutBox=(parts,c,s,suf)=>'<div class="row">'+donut(parts,c,s)+legend(parts,suf)+'</div>';
const pg=(v,c)=>'<div class="pg"><i style="width:'+v+'%;background:'+(c||(v>=90?'var(--ok)':v>=75?'var(--acc)':'var(--warn)'))+'"></i></div>';
const card=(t,b,a)=>'<div class="card"><h3>'+t+(a?'<a href="'+a[1]+'" target="_blank" rel="noopener">'+a[0]+'</a>':'')+'</h3>'+b+'</div>';
const tbl=(h,r)=>'<div class="tw"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+r.map(x=>'<tr>'+x.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>';
const chip=(t,c)=>'<span class="chip '+c+'">'+t+'</span>';
function kpi(i,l,v,d,s,col,goodUp){const up=d>=0,good=goodUp===false?!up:up;return '<div class="card kpi"><div class="l"><span class="ic" style="background:'+col+'22">'+i+'</span>'+l+'</div><div class="v">'+v+'</div><div class="d">'+(d==null?'':'<span class="'+(good?'up':'dn')+'">'+(up?'↑ ':'↓ ')+Math.abs(d)+'%</span> ')+s+'</div></div>'}
const days7=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')});
const M=v=>String(v).replace('.',',')+' млн';
function head(t,s){return '<div class="top"><div><h1>'+t+'</h1><p>'+s+'</p></div><div class="row"><span class="pill">📅 '+NOW.date+' · '+NOW.time+'</span><span class="pill">👤 Владелец</span></div></div>'}
function alerts(a){return a.map(x=>'<div class="alert"><span class="dot" style="background:var(--'+x[3]+')"></span><div style="flex:1"><b>'+x[0]+'</b><div class="hint">'+x[1]+'</div></div><span class="hint">'+x[2]+'</span></div>').join('')}
// ------- данные (демо)
const VPR=[["Вакцина против гепатита А инактивированная (суспензия 250 ЕД, 1 фл — 1 доза 0,5 мл)", "Китай", "детская доза", 380000], ["Вакцина против гепатита Б (рДНК), суспензия для инъекций (1 доза — 1,0 мл)", "Индия", "детская доза", 100000], ["Вакцина против гепатита Б (рДНК), суспензия для инъекций (1 доза — 1,0 мл)", "Индия", "взрослая доза", 250000], ["Менингококковая полисахаридная вакцина групп A, C, Y, W135 (1 фл — 1 доза, растворитель 0,5 мл, шприц)", "Китай", "доза", 650000], ["Вакцина против гриппа «Инфлювак Тетра» инактивированная (суспензия, 1 фл — 1 доза 0,5 мл, одноразовый шприц)", "Нидерланды", "доза", 240000], ["OLVAXTAR-QUAD, адсорбированная коклюшно-дифтерийно-столбнячная вакцина и ХИБ (АКДС), суспензия 1 фл — 1 доза", "Китай", "доза", 500000], ["TETRAXIM, вакцина против дифтерии, столбняка, коклюша, полиомиелита", "Франция", "детская доза", 620000], ["HEXAXIM, вакцина против дифтерии, столбняка, коклюша, гепатита Б, полиомиелита, гемофильной инфекции типа Б", "Франция", "детская доза", 900000], ["АДС-М, вакцина адсорбированная дифтерийно-столбнячная для взрослых и подростков", "Китай", "доза", 240000], ["КПК, вакцина против кори, паротита, краснухи живая", "Индия", "доза", 260000], ["Превенар-13, вакцина против пневмококковой инфекции (13-валентная)", "США", "доза", 820000], ["OLVAXTAR-MEN, вакцина против менингококковой инфекции", "Индия", "доза", 120000], ["Анатоксин столбнячный", "Индия", "доза", 180000], ["Вакцина ротавирусная (пероральная) 2,5 мл — 1 доза", "Индия", "доза", 250000], ["Вакцина от полиомиелита (пероральная) 2,5 мл — 1 доза", "Индия", "доза", 260000]];
const FIN={lab:4.2,clinic:5.4,vac:2.1};
const VIEWS={};
VIEWS.home=()=>{
 const st=STAFF.map(status),on=st.filter(s=>s[0]=='На месте').length,lunch=st.filter(s=>s[0]=='Обед').length,out=st.filter(s=>s[0]=='На выезде'||s[0]=='По вызову').length;
 const tot=FIN.lab+FIN.clinic+FIN.vac;
 return head('Главная','Сводка по всему центру')+
 '<div class="grid g7">'+kpi('🧪','Анализов',38,12,'к вчера','#2f7be5')+kpi('🩺','Пациентов клиники',22,8,'к вчера','#2fa35b')+kpi('💉','Прививок',14,10,'к вчера','#8a6fd0')+kpi('💰','Выручка всего',M(tot.toFixed(1)),15,'к вчера','#e5902f')+kpi('👥','Сотрудников на месте',on+' из '+STAFF.length,null,'обед: '+lunch+' · выезд: '+out,'#2fa3b3')+kpi('⚠️','Проблемы',3,-4,'к вчера','#d6455d',false)+'</div>'+
 '<div class="grid g3">'+card('Выручка по направлениям',donutBox([['Лаборатория',FIN.lab,'#2f7be5'],['Клиника',FIN.clinic,'#2fa35b'],['Вакцинация',FIN.vac,'#8a6fd0']],M(tot.toFixed(1)),'сегодня'))+
 card('Выручка за 7 дней, млн сум',bars([8.9,9.6,10.1,9.4,10.8,10.2,11.7],days7,'#2f7be5',v=>String(v).replace('.',',')))+
 card('Очередь регистратуры (Гулчирой)',(()=>{const n=qCount('reg'),st=cabState('reg');return '<div class="row">'+chip(st[0],st[1])+'</div><div class="mini" style="margin-top:8px"><div>Сегодня<b>'+n.all+'</b></div><div>Ожидают<b>'+n.wait+'</b></div><div>Завершены<b>'+n.done+'</b></div><div>Пропущены<b>'+n.skip+'</b></div></div><button class="btn" style="margin-top:10px" data-view="queue">Открыть очередь</button>'})())+
